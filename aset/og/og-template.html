<!doctype html>
<!-- OG card renderer (NVA-8). Open with ?eyebrow=...&title=... and screenshot at 1200x630. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NOVA Lab OG template</title>
    <link rel="stylesheet" href="../hifi/prototype/assets/proto.css" />
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #fff;
      }
      .logo-og {
        position: absolute;
        left: 80px;
        top: 80px;
        height: 44px;
      }
      .art {
        position: absolute;
        left: 760px;
        top: 70px;
        width: 400px;
      }
      .txt {
        position: absolute;
        left: 80px;
        right: 480px;
        bottom: 96px;
      }
      .eb {
        font: 600 18px/24px var(--font-body);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #3b2fd1;
      }
      .tt {
        margin-top: 20px;
        font: 700 64px/72px var(--font-display);
        letter-spacing: -0.02em;
        color: #0b0f19;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 8px;
        background: #3b2fd1;
      }
    </style>
  </head>
  <body>
    <img class="logo-og" src="../logo/novalab-logo-color.svg" alt="NOVA Lab" />
    <img class="art" src="../hifi/prototype/assets/art-hero.svg" alt="" />
    <div class="txt">
      <p class="eb" id="eb"></p>
      <p class="tt" id="tt"></p>
    </div>
    <div class="bar"></div>
    <script>
      /* global document, window, URLSearchParams */
      const q = new URLSearchParams(window.location.search);
      document.getElementById("eb").textContent =
        q.get("eyebrow") || "UI/UX design · Animation · Website development";
      document.getElementById("tt").textContent =
        q.get("title") || "Design, motion, and web, built by one team.";
    </script>
  </body>
</html>
