name: preview

# Deploys every non-main branch to a Cloudflare Pages preview (<branch>.<project>.pages.dev).
# Previews are protected by Cloudflare Access and served with X-Robots-Tag: noindex (public/_headers).
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  PROJECT: ${{ vars.CF_PAGES_PROJECT || 'novalab' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Set repo variable CF_PAGES_ENABLED=true once Cloudflare secrets exist (NVA-6 scope 1).
    if: vars.CF_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (preview)
        run: pnpm run build
        env:
          SITE_URL: https://${{ env.PROJECT }}.pages.dev
      - name: Deploy to Cloudflare Pages (preview)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          out=$(pnpm exec wrangler pages deploy dist --project-name="$PROJECT" --branch="$BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify headers on preview
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: scripts/check-headers.sh "${{ steps.deploy.outputs.url }}" --expect-noindex | tee -a "$GITHUB_STEP_SUMMARY"
