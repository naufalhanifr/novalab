name: deploy-prod

# Production deploys ONLY from main, only after ci passes, through the protected "production" environment.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  PROJECT: ${{ vars.CF_PAGES_PROJECT || 'novalab' }}

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Set repo variable CF_PAGES_ENABLED=true once Cloudflare secrets exist (NVA-6 scope 1).
    if: github.ref == 'refs/heads/main' && vars.CF_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PROD_URL || format('https://{0}.pages.dev', env.PROJECT) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (production)
        run: pnpm run build
        env:
          SITE_URL: ${{ vars.PROD_URL || format('https://{0}.pages.dev', env.PROJECT) }}
      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA"
      - name: Smoke test + header check
        env:
          URL: ${{ vars.PROD_URL || format('https://{0}.pages.dev', env.PROJECT) }}
        run: |
          sleep 15
          scripts/check-headers.sh "$URL" | tee -a "$GITHUB_STEP_SUMMARY"
